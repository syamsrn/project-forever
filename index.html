<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>One Glance • Jo ❤️ Syam</title>

    <meta
      name="description"
      content="Every beautiful story begins with one glance."
    />

    <!-- Favicon -->
    <link rel="icon" href="assets/icons/favicon.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- GSAP -->
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/gsap.min.js"
    ></script>

    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.7/ScrollTrigger.min.js"
    ></script>
  </head>

  <body>
    <div id="app">
      <!-- ================================================= -->
      <!-- GLOBAL UI -->
      <!-- ================================================= -->

      <!-- Ambient Background -->

      <div id="ambient-background">
        <div class="ambient ambient-1"></div>

        <div class="ambient ambient-2"></div>

        <div class="ambient ambient-3"></div>
      </div>

      <!-- Cursor Glow -->

      <div id="cursor-glow"></div>

      <!-- Story Progress -->

      <nav id="story-progress">
        <div class="progress-line">
          <div class="progress-fill"></div>
        </div>

        <ul>
          <li data-target="intro"></li>
          <li data-target="question"></li>
          <li data-target="hero"></li>
          <li data-target="countup"></li>
          <li data-target="timeline"></li>
          <li data-target="journey"></li>
          <li data-target="trips"></li>
          <li data-target="gallery"></li>
          <li data-target="letter"></li>
          <li data-target="moon"></li>
          <li data-target="ending"></li>
        </ul>
      </nav>

      <!-- ================================================= -->
      <!-- CHAPTER 01 : CINEMATIC INTRO -->
      <!-- ================================================= -->

      <section id="intro"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 02 : THE QUESTION -->
      <!-- ================================================= -->

      <section id="question"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 03 : HERO -->
      <!-- ================================================= -->

      <header id="hero"></header>

      <!-- ================================================= -->
      <!-- CHAPTER 04 : COUNT UP -->
      <!-- ================================================= -->

      <section id="countup"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 05 : OUR STORY -->
      <!-- ================================================= -->

      <section id="timeline"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 06 : OUR JOURNEY -->
      <!-- ================================================= -->

      <section id="journey"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 07 : EVERY PLACE WE VISITED -->
      <!-- ================================================= -->

      <section id="trips"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 08 : OUR MEMORIES -->
      <!-- ================================================= -->

      <section id="gallery"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 09 : MY LETTER -->
      <!-- ================================================= -->

      <section id="letter"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 10 : SECRET MOON -->
      <!-- ================================================= -->

      <section id="moon"></section>

      <!-- ================================================= -->
      <!-- CHAPTER 11 : FINALE -->
      <!-- ================================================= -->

      <footer id="ending"></footer>
    </div>

    <script src="assets/js/app.js" defer></script>
  </body>
</html>
